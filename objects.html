         let name = "Hello Hello Good Morning"; // immutable
        let cars = ["volvo", "maruti", "BMW", "XUV"];
        let age = 50;
        console.log(name.replace("Hello", "Hi")); // replaces first occurance
        console.log(name.replaceAll("Hello", "Hi")); // replaces all the occurance
        console.log(name);

        console.log(name.indexOf("Good")); // return the index of first character
        console.log(name.valueOf()); // no need to call it explicitly

        console.log(name.startsWith("Hello")); // it checks the starting character oo string
        console.log(name.endsWith("Hello")); // it checks the ending character of string

        console.log(name.substr(name.indexOf("G"), name.indexOf("G") - 7)); // it will extarct specific part of a string (startIndex, length)
        console.log(name.substring(12, 16)); // it extracts the characted between two indexs

        console.log(name.split(" ")); // it converts string to an array
        console.log(cars.join(" ")); // it converts array to a string
